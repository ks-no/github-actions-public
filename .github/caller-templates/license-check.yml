# Dependency-Track license scan template.
# Optional secret: dependency_track_api_key. If project_name is empty, the repo name is used.
name: License Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Dependency-Track project name override.'
        type: string
        required: false
        default: ''
      project_version:
        description: 'Dependency-Track project version.'
        type: string
        required: false
        default: 'main'
      project_uuid:
        description: 'Optional pre-resolved project UUID.'
        type: string
        required: false
        default: ''
      dependency_track_base_url:
        description: 'Dependency-Track base URL.'
        type: string
        required: false
        default: 'https://dt.fiks.dev.ks.no'

permissions:
  contents: read

jobs:
  license-scan:
    uses: ks-no/github-actions-public/.github/workflows/license-check.yml@main
    secrets: inherit
    with:
      project_name: ${{ inputs.project_name || '' }}
      project_version: ${{ inputs.project_version || 'main' }}
      project_uuid: ${{ inputs.project_uuid || '' }}
      dependency_track_base_url: ${{ inputs.dependency_track_base_url || 'https://dt.fiks.dev.ks.no' }}