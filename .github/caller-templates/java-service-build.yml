# Backstage starter workflow for a Java service.
# Required secrets: ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD, KS_RUNNER_APP_ID, KS_RUNNER_PRIVATE_KEY,
# GPG_PRIVATE_KEY, DEPENDENCY_TRACK_API_KEY.
name: Build and deploy application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      is_release:
        description: 'Release build?'
        type: boolean
        required: false
        default: false
      semver_increment:
        description: 'Select semver increment. Leave empty when version is set.'
        type: choice
        required: false
        options:
          - ''
          - next major
          - next minor
          - next patch
      version:
        description: 'Exact release version. Leave empty when using semver_increment.'
        type: string
        required: false
      deploy:
        description: 'Deploy after the release build finishes.'
        type: boolean
        required: true
        default: false
      reviewer:
        description: 'Reviewer used when creating release notes.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  checks: write

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/java-service-build.yml@main
    secrets: inherit
    with:
      semver_increment: ${{ inputs.semver_increment || '' }}
      is_release: ${{ github.event_name == 'workflow_dispatch' && inputs.is_release || false }}
      version: ${{ inputs.version || '' }}
      java_version: 'java21'
      # Add a Helm chart to this repo, then set helm_chart to its folder name to
      # enable chart publishing and the 'deploy' input below. Left empty, both are skipped.
      helm_chart: ''
      autodeploy: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy || false }}
      reviewer: ${{ inputs.reviewer || '' }}
