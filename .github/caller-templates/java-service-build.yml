name: Build and Deploy Java Service
description: Builds a Java application, publishes a Docker image, and deploys it to OpenShift via Helm. Supports snapshot and release builds with configurable environments.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      is_release:
        description: 'Release build?'
        type: boolean
        default: false
      version:
        description: 'Version number for release (e.g. 1.2.3). Leave empty for auto.'
        type: string
        required: false
      environment:
        description: 'Deploy environment'
        type: string
        default: 'dev'

permissions:
  id-token: write
  contents: write
  checks: write

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/java-service-build.yml@main
    secrets:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      KS_RUNNER_APP_ID: ${{ secrets.KS_RUNNER_APP_ID }}
      KS_RUNNER_PRIVATE_KEY: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
    with:
      is_release: ${{ inputs.is_release || false }}
      version: ${{ inputs.version || '' }}
      environment: ${{ inputs.environment || 'dev' }}
      # Optional (copy-edit): uncomment to enable deployment after successful build and publish.
      # autodeploy: true
      # Optional (copy-edit): uncomment to enable Helm publish/deploy and set chart name.
      # helm_chart: 'my-service'
      # Optional (copy-edit): uncomment to override chart location if not in charts/{helm_chart}.
      # helm_folder: 'charts/my-service'
      # Optional (copy-edit): uncomment to set reviewer used for release pull request flow.
      # reviewer: 'team-platform'
