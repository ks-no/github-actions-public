name: Build Java Library
description: Builds, tests, and publishes a Java library to Artifactory using Maven. Supports snapshot and release builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      is_release:
        description: 'Release build?'
        type: boolean
        default: false
      version:
        description: 'Version number for release (e.g. 1.2.3). Leave empty for auto.'
        type: string
        required: false

permissions:
  id-token: write
  contents: write
  checks: write
  #enable the below if you want to have zizmor scan output in GHAS security tab
  #security-events: write

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/java-library-build.yml@main
    secrets:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      KS_RUNNER_APP_ID: ${{ secrets.KS_RUNNER_APP_ID }}
      KS_RUNNER_PRIVATE_KEY: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
    with:
      is_release: ${{ inputs.is_release || false }}
      version: ${{ inputs.version || '' }}
      # Optional (copy-edit): uncomment to use GitHub-hosted runners for public repositories.
      # runner: 'ubuntu-latest'
      # Optional (copy-edit): uncomment to set reviewer used in generated release notes.
      # reviewer: 'team-platform'
      # Optional (copy-edit): uncomment to trigger component tests after build.
      # component_test_project: 'fiks-io-klient-java-komponent-test'
      # component_test_version: '1.2.3'
