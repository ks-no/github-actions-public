# Standalone Helm deploy template.
# Required secrets: KS_RUNNER_APP_ID and KS_RUNNER_PRIVATE_KEY.
# Copy into a target repo when you want to deploy an already-published version.
name: Deploy Helm Chart
# For repos with a single service, consider hardcoding helm_chart in the with: block
# and removing it from inputs — see fiks-konfigurasjon for an example.

on:
  workflow_dispatch:
    inputs:
      helm_chart:
        description: 'Helm chart name to deploy.'
        type: string
        required: true
      environment:
        description: 'Deployment environment.'
        type: choice
        required: true
        options:
          - dev
          - test
          - prod
      version:
        description: 'Version number to deploy.'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ks-no/github-actions-public/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      helm_chart: ${{ inputs.helm_chart }}
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}