# Java library build template for internal Artifactory publishing.
# Required secrets: ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD, KS_RUNNER_APP_ID,
# KS_RUNNER_PRIVATE_KEY, DEPENDENCY_TRACK_API_KEY.
# Use version OR semver_increment. component_test_project is optional.
name: Java Library Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      java_version:
        description: 'Java version to use (for example java21).'
        type: string
        required: false
        default: 'java21'
      is_release:
        description: 'Release build?'
        type: boolean
        required: false
        default: false
      version:
        description: 'Version number for release (e.g. 1.2.3). Leave empty when using semver_increment.'
        type: string
        required: false
        default: ''
      semver_increment:
        description: 'Choose the next version bump when version is empty. Mutually exclusive with version.'
        type: choice
        required: false
        options:
          - ''
          - next major
          - next minor
          - next patch
      reviewer:
        description: 'Optional reviewer for the release.'
        type: string
        required: false
        default: ''
      component_test_project:
        description: 'GitHub repo name under ks-no for component tests. Leave empty to skip.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  checks: write

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/java-library-internal-build.yml@main
    secrets: inherit
    with:
      java_version: ${{ inputs.java_version || 'java21' }}
      is_release: ${{ inputs.is_release || false }}
      version: ${{ inputs.version || '' }}
      semver_increment: ${{ inputs.semver_increment || '' }}
      reviewer: ${{ inputs.reviewer || '' }}
      component_test_project: ${{ inputs.component_test_project || '' }}