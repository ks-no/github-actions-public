# Backstage starter workflow for a .NET library.
# Required secrets: ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD, KS_RUNNER_PRIVATE_KEY, DEPENDENCY_TRACK_API_KEY.
name: .NET Library Build and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      isRelease:
        description: 'Release build?'
        type: boolean
        required: false
        default: false
      pushToNugetOrg:
        description: 'Push to nuget.org?'
        type: boolean
        required: false
        default: false
      specifiedVersion:
        description: 'Version (X.X.X). Leave empty for auto.'
        required: false
        default: ''
      releaseNotes:
        description: 'Release notes.'
        required: false
        default: 'No changes specified'
      reviewer:
        description: 'Reviewer name.'
        required: false
        default: 'No review required'

permissions:
  contents: write
  checks: write

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/dotnet-library-build.yml@main
    secrets: inherit
    with:
      is-release: ${{ github.event_name == 'workflow_dispatch' && inputs.isRelease || false }}
      push-to-nuget-org: ${{ github.event_name == 'workflow_dispatch' && inputs.pushToNugetOrg || false }}
      specified-version: ${{ github.event_name == 'workflow_dispatch' && inputs.specifiedVersion || '' }}
      release-notes: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseNotes || 'No changes specified' }}
      reviewer: ${{ inputs.reviewer || 'No review required' }}
      dotnet-version: '8.0.x'
      run-windows-build: true
