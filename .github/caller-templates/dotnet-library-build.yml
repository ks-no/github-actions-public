# Builds, tests, signs, and publishes a .NET NuGet library to Artifactory. Supports release builds,
# NuGet.org publishing (OIDC trusted publishing), and KeyLocker code signing.
name: Build .NET Library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      is-release:
        description: 'Release build? (signs with DigiCert KeyLocker and publishes to nuget.org)'
        type: boolean
        default: false
      push-to-nuget-org:
        description: 'Push an unsigned pre-release to nuget.org?'
        type: boolean
        default: false

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/dotnet-library-build.yml@main
    permissions:
      contents: write
      checks: write
    secrets:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      KS_RUNNER_PRIVATE_KEY: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE: ${{ secrets.SM_CLIENT_CERT_FILE }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
    with:
      is-release: ${{ inputs.is-release || false }}
      push-to-nuget-org: ${{ inputs.push-to-nuget-org || false }}
      # Optional (copy-edit): uncomment and set an explicit release version (for example 1.2.3).
      # specified-version: '1.2.3'
      # Optional (copy-edit): uncomment to disable the parallel Windows build.
      # run-windows-build: false
      # Optional (copy-edit): uncomment to trigger remote integration tests after publish.
      # integration-test-repo: 'fiks-io-client-dotnet-integration-tests'
      # integration-test-workflow: 'dotnet-component-test-pipeline-windows.yml'
      # integration-test-package-name: 'KS.Fiks.IO.Client'

  publish:
    name: Publish to NuGet.org
    needs: build
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      (inputs.is-release == true || inputs.push-to-nuget-org == true) &&
      !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download signed packages (release)
        if: inputs.is-release == true
        uses: ks-no/github-actions-public/download-artifact@main
        with:
          name: nuget-packages-signed
          path: packages

      - name: Download unsigned packages (pre-release)
        if: inputs.is-release != true
        uses: ks-no/github-actions-public/download-artifact@main
        with:
          name: nuget-packages-unsigned
          path: packages

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Push to NuGet.org (OIDC trusted publishing)
        uses: ks-no/github-actions-public/dotnet-push-to-nuget-org@main
        with:
          mode: oidc
          nuget-user: ${{ secrets.NUGET_USER }}
          package-path: packages
          verify-signature: ${{ inputs.is-release == true }}
