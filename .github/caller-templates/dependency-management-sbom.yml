name: Dependency Management SBOM

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    uses: ks-no/github-actions-public/.github/workflows/dependency-management-sbom.yml@main
    secrets:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
    with:
      # Optional (copy-edit): uncomment to override defaults.
      # java_version: 'java21'
      # cyclonedx_plugin_version: '2.9.1'
      # output_bom_name: 'dependency-management-bom'
      # sbom_project_name: 'my-repo-dependency-management'
      # working_directory: 'some-submodule' # scan a pom.xml other than the repo root's
      # sbom_group_id: 'no.ks.fiks.sbom'
      # sbom_artifact_id: 'my-repo-dependency-management-sbom'
      # is_public: true # true if this repository is public, false otherwise
      # container_image_refs: | # one or more image refs (ideally @sha256-pinned); uploaded as a single merged project
      #   gcr.io/distroless/java25-debian13:nonroot@sha256:...
      #   gcr.io/distroless/java21-debian13:nonroot@sha256:...
      # container_sbom_project_name: 'my-repo-container-images'
      # syft_version: 'v1.52.0'
      # cyclonedx_cli_version: 'v0.33.1'
