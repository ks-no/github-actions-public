# Backstage starter workflow for a Node.js service.
# Required secrets: ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD, GPG_PRIVATE_KEY, KS_RUNNER_PRIVATE_KEY.
# Required repo/org variable: KS_RUNNER_APP_ID (GitHub App ID, not a secret).
name: Build and deploy Node.js service

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ks-no/github-actions-public/.github/workflows/nodejs-service-build.yml@main
    secrets: inherit
    with:
      # Add a chart under charts/<name>, then set helm_chart to <name> to enable
      # chart publishing and deployment. Left empty, both are skipped.
      helm_chart: ''
      ks_runner_app_id: ${{ vars.KS_RUNNER_APP_ID }}
