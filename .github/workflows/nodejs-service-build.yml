name: 'Node.js Service Build and Deploy reusable workflow'

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application/image name. Defaults to repository name if not set.'
        required: false
        type: string
        default: ''
      helm_chart:
        description: 'The Helm chart name to publish/deploy. Leave empty to skip helm publish and deploy.'
        required: false
        type: string
        default: ''
      helm_folder:
        description: 'The folder in repo where the Helm chart is located. Defaults to charts/{helm_chart}.'
        required: false
        type: string
        default: ''
      host:
        description: 'The network address to reach this service from, if parameterized in values.yaml.'
        required: false
        type: string
      tenant:
        description: 'The ingress tenant on which the service lives, if parameterized in values.yaml.'
        required: false
        type: string
      docker_registry:
        description: 'Docker registry hostname.'
        required: false
        type: string
        default: 'docker-all.artifactory.fiks.ks.no'
      environment:
        description: 'Deployment environment.'
        required: false
        type: string
        default: 'dev'
      autodeploy:
        description: 'Set true to always deploy after successful build/publish.'
        required: false
        type: boolean
        default: true
      is_release:
        description: 'Whether to make a Github release'
        required: false
        type: boolean
        default: false
      version:
        description: 'The exact version to release. Requires is_release = true.'
        required: false
        type: string
        default: ''
      semver_increment:
        description: 'One of: "next major", "next minor", or "next patch". Requires is_release = true.'
        required: false
        type: string
        default: ''
      package_paths:
        description: 'Space-separated list of paths to projects whose versions should be updated. Defaults to ".".'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version input reserved for future use.'
        required: false
        type: string
        default: '22'
      dockerfile_path:
        description: 'Path to Dockerfile.'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Docker build context path.'
        required: false
        type: string
        default: '.'
      push_latest_on_main:
        description: 'Set true to publish latest tag on main.'
        required: false
        type: boolean
        default: true
      buildx_builder_image:
        description: 'BuildKit image used by docker/setup-buildx-action.'
        required: false
        type: string
        default: 'moby/buildkit:v0.21.0'
      buildx_network:
        description: 'Network mode used by Buildx driver.'
        required: false
        type: string
        default: 'host'
      ks_runner_app_id:
        description: 'GitHub App ID used by deploy action.'
        required: false
        type: string
        default: ''
    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      KS_RUNNER_PRIVATE_KEY:
        required: true

permissions:
  id-token: write
  contents: read
  #enable den under hvis GHAS e aktiv og du vil ha zizmor scan output der
  #security-events: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, x64]
    timeout-minutes: 30
    concurrency:
      group: ${{ format('autobuild-{0}-{1}', github.repository, github.ref_name) }}
      cancel-in-progress: true
    outputs:
      project_version: ${{ steps.version.outputs.resolved_version }}
      image_tag: ${{ steps.tags.outputs.image_tag }}
      chart_version: ${{ steps.tags.outputs.chart_version }}
    steps:
      - name: Checkout code
        uses: ks-no/github-actions-public/checkout@main
        with:
          submodules: 'false'
          fetch-depth: '1'
          fetch-tags: 'false'

      - name: Zizmor Scan
        continue-on-error: true
        uses: ks-no/github-actions-public/zizmor-scan@main

      - name: Validate version input
        if: inputs.is_release == 'true'
        uses: ks-no/github-actions-public/validate-version-inputs@main
        with:
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}
          is_release: ${{ inputs.is_release }}

      - name: Resolve version
        id: version
        uses: ks-no/github-actions-public/complete-version-resolvement@main
        with:
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}
          is_release: ${{ inputs.is_release }}
          snapshot_string: '-'

      - name: Resolve app name and tags
        id: tags
        shell: bash
        run: |
          VERSION_NUMBER=${VERSION%-*}
          SHORT_SHA=${VERSION#*-}
          CHART_VERSION="${VERSION_NUMBER}-sha${SHORT_SHA}"

          APP_NAME="${{ inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ github.event.repository.name }}"
          fi

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.resolved_version }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ inputs.buildx_builder_image }}
            network=${{ inputs.buildx_network }}

      - name: Login to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.docker_registry }}/${{ steps.tags.outputs.app_name }}:${{ steps.tags.outputs.image_tag }}
            ${{ github.ref == 'refs/heads/main' && inputs.push_latest_on_main && format('{0}/{1}:latest', inputs.docker_registry, steps.tags.outputs.app_name) || '' }}
          cache-from: type=registry,ref=${{ inputs.docker_registry }}/${{ steps.tags.outputs.app_name }}:buildcache
          cache-to: type=registry,ref=${{ inputs.docker_registry }}/${{ steps.tags.outputs.app_name }}:buildcache,mode=min,image-manifest=true
          provenance: false

      - name: Publish Helm chart
        if: inputs.helm_chart != ''
        uses: ks-no/github-actions-public/publish-helm@main
        with:
          chart_name: ${{ inputs.helm_chart }}
          chart_version: ${{ steps.tags.outputs.chart_version }}
          image_tag: ${{ steps.tags.outputs.image_tag }}
          host: ${{ inputs.host }}
          tenant: ${{ inputs.tenant }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          need_jfrog_setup: 'true'
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          helm_folder: ${{ inputs.helm_folder || format('charts/{0}', inputs.helm_chart) }}

      - name: Deploy application
        if: inputs.autodeploy == true && inputs.helm_chart != ''
        uses: ks-no/github-actions-public/deploy@main
        with:
          helm_chart: ${{ inputs.helm_chart }}
          environment: ${{ inputs.environment }}
          version: ${{ steps.tags.outputs.chart_version }}
          ks_github_app_id: ${{ inputs.ks_runner_app_id }}
          ks_github_app_private_key: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}

      - name: Update version in package.json
        if: inputs.is_release == true && github.ref_name == 'main'
        shell: bash
        run: |
          for path in ${{ inputs.package_paths }} ; do
            jq --arg version "${{ steps.version.outputs.resolved_version }}" '.version |= $version' "${path}/package.json" > package.json.tmp \
              && mv package.json.tmp "${path}/package.json"
          done

      - name: Commit new version
        if: inputs.is_release == true && github.ref_name == 'main'
        shell: bash
        run: |
          git commit -a -m "Prepare release ${{ steps.version.outputs.resolved_version }}"
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          EOF_MARKER=$(uuidgen)
          echo "commit_message<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Generate release body and set action output
        if: inputs.is_release == true && github.ref_name == 'main'
        id: generate_body
        uses: ks-no/github-actions-public/generate-release-notes@main
        with:
          github-token: ${{ steps.app_token.outputs.app_token }}
          actor: ${{ github.actor }}

      - name: Create GitHub Release
        if: inputs.is_release == true && github.ref_name == 'main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.resolved_version }}
          name: "Release ${{ steps.version.outputs.resolved_version }}"
          body: ${{ steps.generate_body.outputs.release_body }}
          draft: false
          prerelease: false

      - name: Workflow summary
        shell: bash
        run: |
          {
            echo "## Node.js Service Build Summary"
            echo "- project_version: ${{ steps.version.outputs.resolved_version }}"
            echo "- image_tag: ${{ steps.tags.outputs.image_tag }}"
            echo "- chart_version: ${{ steps.tags.outputs.chart_version }}"
            echo "- deploy_enabled: ${{ inputs.autodeploy }}"
            echo "- deploy_executed: ${{ inputs.autodeploy }}"
          } >> "$GITHUB_STEP_SUMMARY"
