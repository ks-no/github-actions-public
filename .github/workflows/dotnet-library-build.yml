name: '.NET Library Build reusable workflow'

on:
  workflow_call:
    inputs:
      is-release:
        description: 'Release build? (signs with DigiCert KeyLocker and publishes to nuget.org)'
        type: boolean
        required: false
        default: false
      push-to-nuget-org:
        description: 'Push an unsigned pre-release to nuget.org? (no DigiCert signing)'
        type: boolean
        required: false
        default: false
      specified-version:
        description: 'Version (X.X.X) - leave empty for auto'
        type: string
        required: false
        default: ''
      release-notes:
        description: 'Release notes'
        type: string
        required: false
        default: 'No changes specified'
      reviewer:
        description: 'Reviewer name'
        type: string
        required: false
        default: 'No review required'
      dotnet-version:
        description: '.NET SDK version'
        type: string
        required: false
        default: '8.0.x'
      run-windows-build:
        description: 'Run Windows parallel build?'
        type: boolean
        required: false
        default: true
      integration-test-repo:
        description: 'Integration test repo name under ks-no (e.g., fiks-io-client-dotnet-integration-tests). Leave empty to skip.'
        type: string
        required: false
        default: ''
      integration-test-workflow:
        description: 'Workflow file in integration test repo (e.g., dotnet-component-test-pipeline-windows.yml)'
        type: string
        required: false
        default: ''
      integration-test-package-name:
        description: 'NuGet package name for integration tests (e.g., KS.Fiks.IO.Client)'
        type: string
        required: false
        default: ''
      windows-restore-args:
        description: 'Additional restore arguments for Windows build'
        type: string
        required: false
        default: ''
      windows-test-verbosity:
        description: 'Test verbosity for Windows build'
        type: string
        required: false
        default: 'normal'
      allow-prerelease:
        description: 'Comma-separated NuGet package ids allowed to be prerelease (release-gate exceptions)'
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      KS_RUNNER_PRIVATE_KEY:
        required: true
      DEPENDENCY_TRACK_API_KEY:
        required: true
      NUGET_USER:
        required: false
      SM_API_KEY:
        required: false
      SM_CLIENT_CERT_FILE:
        required: false
      SM_CLIENT_CERT_PASSWORD:
        required: false
    outputs:
      current-version:
        description: 'Resolved current version'
        value: ${{ jobs.initialize.outputs.current-version }}
      next-version:
        description: 'Next version'
        value: ${{ jobs.initialize.outputs.next-version }}
      full-version:
        description: 'Full version (with prerelease suffix if any)'
        value: ${{ jobs.initialize.outputs.full-version }}

permissions:
  contents: write
  checks: write
  #enable the below if you want to have zizmor scan output in GHAS security tab
  #security-events: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      current-version: ${{ steps.version.outputs.current-version }}
      next-version: ${{ steps.version.outputs.next-version }}
      full-version: ${{ steps.version.outputs.full-version }}
      build-opts: ${{ steps.version.outputs.build-opts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Zizmor Scan
        continue-on-error: true
        uses: ks-no/github-actions-public/zizmor-scan@main
        with:
          output_format: 'github' # Use 'sarif' for GHAS Security tab, or 'github' for inline annotations
      - id: version
        uses: ks-no/github-actions-public/dotnet-calculate-version@main
        with:
          specified-version: ${{ inputs.specified-version }}
          is-release: ${{ inputs.is-release }}
          branch-name: ${{ github.ref_name }}
          run-number: ${{ github.run_number }}

  build-linux:
    name: Build (Linux)
    needs: initialize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Build and Test
        uses: ks-no/github-actions-public/dotnet-build-and-test@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          build-opts: ${{ needs.initialize.outputs.build-opts }}
          artifactory-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      # Release gate: a release must not drag in prerelease/alpha dependencies (incl. transitive).
      # Hard-fails build-linux on release -> integration-test and publish are skipped, so no
      # DigiCert signature is spent on a tainted closure. Warns only on snapshot builds.
      - name: Check for prerelease dependencies
        uses: ks-no/github-actions-public/dotnet-check-prerelease-dependencies@main
        with:
          fail-on-prerelease: ${{ inputs.is-release }}
          allow-prerelease: ${{ inputs.allow-prerelease }}

      - name: Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests (Linux)
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ks-no/github-actions-public/dotnet-generate-sbom@main
        with:
          version: ${{ needs.initialize.outputs.full-version }}

      - name: Upload SBOM
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json
          if-no-files-found: ignore

      - name: Setup JFrog CLI
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ks-no/github-actions-public/setup-jfrog-cli@main
        with:
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: SBOM Upload and Report
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ks-no/github-actions-public/sbom-upload-and-report@main
        with:
          dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          is_release: ${{ inputs.is-release }}
          artifactory_repository_name: ${{ github.event.repository.name }}
          artifactory_artifact_version: ${{ needs.initialize.outputs.full-version }}

      # Push the unsigned package to Artifactory for ALL builds so that integration
      # tests can restore this exact candidate version BEFORE we spend a DigiCert
      # signature on release. Artifactory is the internal mirror; the signed artifact
      # is published to nuget.org only.
      - name: Push to Artifactory
        uses: ks-no/github-actions-public/dotnet-push-to-artifactory@main
        with:
          artifactory-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      # Stage packages into a FLAT directory so the signed/push steps find them at
      # packages/*.nupkg. Uploading **/Release/*.nupkg would preserve the nested build
      # path, and after download the signing/push globs (packages/*.nupkg) miss the files.
      - name: Stage unsigned packages
        if: inputs.is-release || inputs.push-to-nuget-org
        shell: bash
        run: |
          mkdir -p staging
          find . -path '*/Release/*.nupkg' -exec cp {} staging/ \;
          find . -path '*/Release/*.snupkg' -exec cp {} staging/ \;
          ls -l staging

      # Keep the unsigned candidate for the publish job (signing + nuget.org push).
      - name: Upload unsigned packages
        if: inputs.is-release || inputs.push-to-nuget-org
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-unsigned
          path: staging/
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    needs: initialize
    if: inputs.run-windows-build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Build and Test
        uses: ks-no/github-actions-public/dotnet-build-and-test@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          build-opts: ${{ needs.initialize.outputs.build-opts }}
          artifactory-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          restore-args: ${{ inputs.windows-restore-args || '--disable-parallel --verbosity detailed' }}
          test-verbosity: ${{ inputs.windows-test-verbosity || 'detailed'}}

      - name: Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests (Windows)
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

  # Triggers the remote component/integration tests and reports a check run back on the
  # client repo. On release we WAIT for the result, so a failing component test stops the
  # release BEFORE any DigiCert signing happens. On snapshot/pre-release it is fire-and-forget.
  integration-test:
    name: Integration Tests
    needs: [initialize, build-linux]
    if: |
      !cancelled() &&
      needs.build-linux.result == 'success' &&
      inputs.integration-test-repo != '' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       inputs.is-release == true || inputs.push-to-nuget-org == true)
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub App
        id: setup-github-app
        uses: ks-no/github-actions-public/setup-github-app@main
        with:
          ks_github_app_id: ${{ vars.KS_RUNNER_APP_ID }}
          ks_github_app_private_key: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}

      - name: Trigger Integration Tests
        uses: ks-no/github-actions-public/trigger-remote-integration-tests@main
        with:
          app-token: ${{ steps.setup-github-app.outputs.app_token }}
          integration-test-repo: ${{ inputs.integration-test-repo }}
          integration-test-workflow: ${{ inputs.integration-test-workflow }}
          component-version: ${{ needs.initialize.outputs.full-version }}
          component-package-name: ${{ inputs.integration-test-package-name }}
          wait-for-completion: ${{ inputs.is-release && 'true' || 'false' }}

  # Signs packages with DigiCert KeyLocker (release only) and uploads them as
  # nuget-packages-signed. The nuget.org push + GitHub release happen in the CALLING repo's
  # workflow — NuGet OIDC trusted publishing requires the publishing job to be defined in the
  # consuming repo (the token's `repository` AND `job_workflow_ref` claims must match that
  # repo's per-repo trusted-publishing policy; a shared reusable workflow can never match both).
  sign:
    name: Sign packages (KeyLocker)
    needs: [initialize, build-linux, build-windows, integration-test]
    if: |
      !cancelled() &&
      needs.build-linux.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') &&
      inputs.is-release == true &&
      !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: windows-latest
    steps:
      # Pinned to a known-good SHA so a change to the action can never burn a signature.
      # Downloads nuget-packages-unsigned, signs in place, re-uploads as nuget-packages-signed.
      - name: Sign packages with KeyLocker
        uses: ks-no/github-actions-public/dotnet-sign-nuget-packages@6c94bb9073e2619e18b74410ebfed4b40b4f6506
        with:
          artifact-name: nuget-packages-unsigned
          package-path: packages
          signed-artifact-name: nuget-packages-signed
          sm-host: ${{ vars.SM_HOST }}
          sm-keypair-alias: ${{ vars.SM_KEY_PAIR_ALIAS }}
          sm-api-key: ${{ secrets.SM_API_KEY }}
          sm-client-cert-file-base64: ${{ secrets.SM_CLIENT_CERT_FILE }}
          sm-client-cert-password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
