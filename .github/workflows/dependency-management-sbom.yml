name: 'Dependency Management SBOM reusable workflow'

on:
  workflow_call:
    inputs:
      java_version:
        description: 'The Java version to use (e.g., java21).'
        required: false
        type: string
        default: 'java21'
      cyclonedx_plugin_version:
        description: 'Versjon av cyclonedx-maven-plugin. Ikke dependabot-sporet - oppdater manuelt ved behov.'
        required: false
        type: string
        default: '2.9.1'
      output_bom_name:
        description: 'Filnavn (uten .json) for den genererte SBOM-en.'
        required: false
        type: string
        default: 'dependency-management-bom'
      sbom_project_name:
        description: 'Dependency-Track- og Artifactory-prosjektnavn. Default: "<repo>-dependency-management".'
        required: false
        type: string
        default: ''
      working_directory:
        description: >
          Katalog (relativ til repo-roten) der pom.xml for prosjektet som skal
          SBOM-skannes ligger. Brukes for å skanne en annen modul enn
          rot-pom-en, f.eks. en super-pom lenger ned i et multi-modul-repo.
        required: false
        type: string
        default: '.'
      sbom_group_id:
        description: 'groupId for den syntetiske pom-en som SBOM-en genereres fra.'
        required: false
        type: string
        default: 'no.ks.fiks.sbom'
      sbom_artifact_id:
        description: 'artifactId for den syntetiske pom-en. Default: "<repo>-dependency-management-sbom".'
        required: false
        type: string
        default: ''
      is_public:
        description: 'Is this repository public?'
        type: boolean
        required: false
        default: false
    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      DEPENDENCY_TRACK_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ${{ inputs.is_public && 'ubuntu-latest' || fromJSON('["self-hosted", "x64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: ks-no/github-actions-public/checkout@main
        with:
          submodules: false
          fetch-depth: 0
          fetch-tags: true

      - name: install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc

      - name: Validate Java Version
        id: validate_java_version
        run: |
          JAVA_VERSION="${{ inputs.java_version }}"                                                                                                                                                                                                                                                      
          JAVA_VERSION="${JAVA_VERSION#java}"   # 'java17' -> '17'                                                                                                                                                                                                                                       
          if ! [[ "$JAVA_VERSION" =~ ^[0-9]+$ ]]; then                                                                                                                                                                                                                                                   
            echo "Ugyldig java_version: '${{ inputs.java_version }}'" >&2                                                                                                                                                                                                                                
            exit 1                                                                                                                                                                                                                                                                                       
          fi                                                                                                                                                                                                                                                                                             
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"                                                                                                                                                                                                                                          

      - name: Switch Java Version
        uses: ks-no/github-actions-public/setup-java@main
        with:
          java-version: ${{ steps.validate_java_version.outputs.java_version }}
          distribution: 'temurin'

      # Eget lokalrepo, fysisk atskilt fra ~/.m2/repository (ikke bare egen
      # cache-key): denne workflowen laster ned hele dependencyManagement
      # (kan bli mange GB) - langt mer enn det et biblioteksbygg trenger for
      # sine egne eksempelmoduler. To problemer må unngås samtidig:
      # 1) restore-keys er ren streng-prefiks-matching hos GitHub - en
      #    restore-keys-prefiks som "maven-" ville faktisk trigge på en key
      #    som "maven-sbom-<hash>" siden det er en gyldig prefiks-match, og
      #    kunne fått biblioteksbygg til å restore hele denne SBOM-cachen.
      # 2) Selv med en garantert ikke-overlappende cache-key: på gjenbrukte
      #    selvhostede runnere ekstraherer actions/cache INN i en
      #    eksisterende mappe uten å tømme den først. Delte de samme
      #    ~/.m2/repository, ville rester fra denne jobben ligge igjen på
      #    disk og bli feid inn i et helt urelatert biblioteksbygg sin
      #    cache-save rett etterpå, uavhengig av cache-key.
      # Et helt eget path (pekt ut via maven.repo.local, se
      # generate-dependency-management-sbom) løser begge på én gang: de to
      # jobbtypene kan aldri dele - og dermed aldri forurense - samme mappe.
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/.m2-dependency-management-sbom/repository
          key: ${{ runner.os }}-m2-depmgmt-sbom-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-depmgmt-sbom-

      - name: Prepare JFrog CLI
        uses: ks-no/github-actions-public/prepare-the-frog@main
        with:
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      # Gjenbruker den etablerte "git describe"-baserte versjonsberegningen
      # med is_release=false: på en ren tag-commit (release) blir resultatet
      # f.eks. "6.2.0", på alle andre commits "6.2.0-3-gcafebabe".
      - name: Resolve version from git describe
        id: version
        uses: ks-no/github-actions-public/complete-version-resolvement@main
        with:
          is_release: false

      # Ikke en egen input noe sted - utledes fra formen på git describe-
      # resultatet over: fravær av "-N-gHASH"-halen betyr at denne commiten
      # sitter nøyaktig på en release-tag.
      - name: Derive release status from resolved version
        id: release_status
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.resolved_version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Commit is tagged as a release ($VERSION)"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "project_version=release" >> "$GITHUB_OUTPUT"
          else
            echo "Commit is not a release tag ($VERSION)"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "project_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve effective SBOM project name
        id: project_name
        shell: bash
        env:
          PROJECT_NAME_INPUT: ${{ inputs.sbom_project_name }}
          DEFAULT_PROJECT_NAME: ${{ github.event.repository.name }}-dependency-management
        run: |
          set -euo pipefail
          EFFECTIVE_PROJECT_NAME="$PROJECT_NAME_INPUT"
          if [[ -z "$EFFECTIVE_PROJECT_NAME" ]]; then
            EFFECTIVE_PROJECT_NAME="$DEFAULT_PROJECT_NAME"
          fi
          echo "project_name=$EFFECTIVE_PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve effective SBOM artifact id
        id: artifact_id
        shell: bash
        env:
          ARTIFACT_ID_INPUT: ${{ inputs.sbom_artifact_id }}
          DEFAULT_ARTIFACT_ID: ${{ github.event.repository.name }}-dependency-management-sbom
        run: |
          set -euo pipefail
          EFFECTIVE_ARTIFACT_ID="$ARTIFACT_ID_INPUT"
          if [[ -z "$EFFECTIVE_ARTIFACT_ID" ]]; then
            EFFECTIVE_ARTIFACT_ID="$DEFAULT_ARTIFACT_ID"
          fi
          echo "artifact_id=$EFFECTIVE_ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Generate dependency-management SBOM
        id: generate_sbom
        uses: ks-no/github-actions-public/generate-dependency-management-sbom@main
        with:
          mvn_command: 'jfrog mvn'
          output_bom_name: ${{ inputs.output_bom_name }}
          cyclonedx_plugin_version: ${{ inputs.cyclonedx_plugin_version }}
          working_directory: ${{ inputs.working_directory }}
          sbom_group_id: ${{ inputs.sbom_group_id }}
          sbom_artifact_id: ${{ steps.artifact_id.outputs.artifact_id }}
          maven_repo_local: ~/.m2-dependency-management-sbom/repository

      - name: SBOM Upload and Report
        uses: ks-no/github-actions-public/sbom-upload-and-report@main
        with:
          dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          is_release: ${{ steps.release_status.outputs.is_release }}
          project_name: ${{ steps.project_name.outputs.project_name }}
          project_version: ${{ steps.release_status.outputs.project_version }}
          bom_file: ${{ steps.generate_sbom.outputs.bom_file }}
          artifactory_repository_name: ${{ steps.project_name.outputs.project_name }}
          artifactory_artifact_version: ${{ steps.version.outputs.resolved_version }}
