name: Docker image build and deploy
description: >
  Reusable workflow for Docker image-based projects;
  builds image, uploads to Artifactory, and handles auto-deploy
  and release.

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Name of the project (used for Docker image name and JFrog build name)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (defaults to "./Dockerfile")'
        required: false
        default: './Dockerfile'
        type: string
      is_release:
        description: 'true for release, false for snapshot'
        required: true
        type: boolean
      version:
        description: 'Version number to release. Mutually exclusive with semver_increment.'
        required: false
        type: string
      semver_increment:
        description: 'Semantic version point (major, minor or patch) to increase for release. Mutually exclusive with version.'
        required: false
        type: string
    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      KS_RUNNER_APP_ID:
        required: true
      KS_RUNNER_PRIVATE_KEY:
        required: true
      DEPENDENCY_TRACK_API_KEY:
        required: true

jobs:
  build:
    permissions:
      contents: write
      id-token: read
    runs-on: [self-hosted, x64]
    timeout-minutes: 20
    steps:
      - name: 'Validate version inputs'
        if: inputs.is_release == true
        uses: ks-no/github-actions-public/validate-version-inputs@main
        with:
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}
          is_release: ${{ inputs.is_release }}

      - name: Checkout code
        uses: ks-no/github-actions-public/checkout@main
        with:
          submodules: true
          fetch-depth: 2
          token: ${{ steps.app_token.outputs.app_token }}
          fetch-tags: true

      - name: Resolve version
        uses: ks-no/github-actions-public/complete-version-resolvement@main
        id: version
        with:
          is_release: ${{ inputs.is_release }}
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}

      - name: Build and publish Docker image
        uses: ks-no/github-actions-public/publish-docker-no-jib@main
        with:
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          dt_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          dockerfile: ${{ inputs.dockerfile }}
          image_name: ${{ inputs.project_name }}
          is_release: ${{ inputs.is_release }}
          build_name: ${{ inputs.project_name }}
          tags: ${{ steps.version.outputs.resolved_version }}
