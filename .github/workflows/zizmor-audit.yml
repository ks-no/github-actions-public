name: Zizmor Audit

on:
  workflow_call:
    inputs:
      output_format:
        description: 'Output format for Zizmor. Use "sarif" to upload results to GitHub Security tab, or leave empty for inline annotations.'
        required: false
        type: string
        default: 'github'
  workflow_dispatch:

jobs:
  zizmor-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: ks-no/github-actions-public/zizmor-scan@main
        with:
          output_format: ${{ inputs.output_format }}