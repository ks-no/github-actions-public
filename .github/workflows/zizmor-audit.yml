name: Zizmor Audit

on:
  workflow_call:
    inputs:
      output_format:
        description: 'Output format for Zizmor. Use "sarif" to upload results to GitHub Security tab, or leave empty for inline annotations.'
        required: false
        type: string
        default: 'github'
  workflow_dispatch:

jobs:
  zizmor-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: ks-no/github-actions-public/zizmor-scan@main
        with:
          output_format: ${{ inputs.output_format }}