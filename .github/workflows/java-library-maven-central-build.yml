name: 'Main Java Library Build for public Maven Releases'
description: 'eusable workflow that orchestrates building, testing, publishing and promoting a public Java library.'

on:
  workflow_call:
    inputs:
      java_version:
        description: 'The Java version to use.'
        type: string
        required: true
        default: 'java21'
      is_release:
        description: 'Whether to perform a release build.'
        type: boolean
        required: false
        default: false
      version:
        description: 'The new version number for a release (e.g., 1.2.3). Mutually exclusive with semver_increment.'
        type: string
        required: false
      semver_increment:
        description: 'Select semver increment: "next major", "next minor", or "next patch". Mutually exclusive with version.'
        required: false
        type: string
        default: ''
      reviewer:
        description: 'Optional reviewer for the release.'
        required: false
        type: string
        default: ''
      maven_settings_xml:
        description: 'Maven settings.xml for deploying to Maven Central.'
        required: false
        type: string
      component_test_project:
        description: 'GitHub repo name (under ks-no) of the component test project to trigger after build (e.g. fiks-io-klient-java-komponent-test). Leave empty to skip.'
        required: false
        type: string
        default: ''
      component_test_version:
        description: 'Version to use for component tests. If not set, the version from the built POM will be used.'
        required: false
        type: string

    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      KS_RUNNER_APP_ID:
        required: true
      KS_RUNNER_PRIVATE_KEY:
        required: true
      DEPENDENCY_TRACK_API_KEY:
        required: true
      KS_CODESIGN_COMBO:
        required: true
      KS_CODESIGN_COMBO_PASSWD:
        required: true
      SONATYPE_OSSRH_SETTINGS_XML:
        required: true
permissions:
  id-token: write
  contents: write
  checks: write
    #enable the below if you want to have zizmor scan output in GHAS security tab
    #security-events: write
jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    concurrency:
      group: ${{ inputs.is_release == true && format('release-{0}', github.repository) || format('autobuild-{0}-{1}', github.repository, github.ref_name) }}
      cancel-in-progress: true
    steps:
      - name: Validate version inputs
        uses: ks-no/github-actions-public/validate-version-inputs@main
        with:
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}
          is_release: ${{ inputs.is_release }}

      - name: 'Set up GitHub App'
        id: app_token
        uses: ks-no/github-actions-public/setup-github-app@main
        with:
          ks_github_app_id: ${{ secrets.KS_RUNNER_APP_ID }}
          ks_github_app_private_key: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}

      - name: Checkout code
        uses: ks-no/github-actions-public/checkout@main
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.app_token }}
          fetch-tags: true

      - name: Resolve version
        id: resolve_version
        uses: ks-no/github-actions-public/resolve-version@main
        with:
          version: ${{ inputs.version }}
          semver_increment: ${{ inputs.semver_increment }}

      - name: Zizmor Scan
        continue-on-error: true
        uses: ks-no/github-actions-public/zizmor-scan@main
        with:
          output_format: 'github' # Use 'sarif' for GHAS Security tab, or 'github' for inline annotations

      - name: Validate Java Version
        id: validate_java_version
        run: |
          JAVA_VERSION="${{ inputs.java_version }}"
          if [[ "$JAVA_VERSION" =~ ^[0-9]+$ ]]; then
            JAVA_VERSION="java$JAVA_VERSION"
          fi

      - name: Switch Java Version
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          java-version: ${{ steps.validate_java_version.outputs.java_version}}
          distribution: 'temurin'

      - name: Prepare JFrog CLI
        uses: ks-no/github-actions-public/prepare-the-frog@main
        with:
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Cache Maven packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clean cached SNAPSHOT artifacts
        run: |
          find ~/.m2/repository -type d -name "*-SNAPSHOT" -exec rm -rf {} + 2>/dev/null || true

      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0  #Remove when: https://github.com/jfrog/build-info/issues/841 is resolved, resolves to version v5.1
        with:
          maven-version: 3.9.11

      - name: Use Maven settings.xml
        shell: bash
        if: inputs.maven_settings_xml != ''
        run: |
          mkdir -p ~/.m2
          echo "${{ inputs.maven_settings_xml }}" | base64 -d > ~/.m2/settings.xml

      - name: Snapshot - Verify POM
        if: inputs.is_release != true
        shell: bash
        run: |
          jfrog mvn -U -B -P snapshot validate

      - name: Release - Set new version and tag
        if: inputs.is_release == true && (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master'))
        shell: bash
        run: |
          jfrog mvn versions:set -DnewVersion=${{ steps.resolve_version.outputs.resolved_version }} -DgenerateBackupPoms=false
          git commit -am "Release ${{ steps.resolve_version.outputs.resolved_version }}"
          git tag -a ${{ steps.resolve_version.outputs.resolved_version }} -m "Release ${{ steps.resolve_version.outputs.resolved_version }}"

      - name: Release - Verify POM
        if: inputs.is_release == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          jfrog mvn -U -B validate

      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.is_release }}" == "true" && 
                ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ) ]]; then
            export JFROG_CLI_BUILD_NAME="ks-maven"
          else
            export JFROG_CLI_BUILD_NAME="ks-maven-snapshot"
          fi
          export JFROG_CLI_BUILD_NUMBER="${{ github.run_number }}"
          jfrog mvn -DinstallAtEnd=true -U -B clean install

      - name: read current version for use in component tests
        id: pom_version_for_tests
        if: inputs.component_test_project != ''
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger component tests
        if: inputs.component_test_project != ''
        id: trigger_component_tests
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app_token.outputs.app_token }}
          script: |
            const intOwner = 'ks-no';
            const intRepo = '${{ inputs.component_test_project }}';
            const workflowId = 'component-test.yml';
            const componentVersion = '${{ inputs.component_test_version }}' || '${{ steps.pom_version_for_tests.outputs.version }}';
            const clientOwner = context.repo.owner;
            const clientRepo  = context.repo.repo;
            const clientSha   = context.sha;

            const { data: checkRun } = await github.rest.checks.create({
              owner: clientOwner,
              repo:  clientRepo,
              name:  'Component Tests',
              head_sha:   clientSha,
              status:     'in_progress',
              started_at: new Date().toISOString(),
              output: {
                title:   'Component Tests',
                summary: `Running component tests in ${intRepo} with version ${componentVersion}`
              }
            });

            await github.rest.actions.createWorkflowDispatch({
              owner: intOwner,
              repo:  intRepo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                componentVersion,
                clientOwner,
                clientRepo,
                checkRunId: String(checkRun.id)
              }
            });

            console.log(`Component tests triggered in ${intRepo} (check run #${checkRun.id})`);
            core.setOutput('check-run-id', String(checkRun.id));

      - name: Wait for component tests
        if: inputs.component_test_project != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app_token.outputs.app_token }}
          script: |
            const clientOwner = context.repo.owner;
            const clientRepo  = context.repo.repo;
            const checkRunId  = Number('${{ steps.trigger_component_tests.outputs.check-run-id }}');
            const pollIntervalMs = 30_000;
            const maxAttempts = 60;
            let attempts = 0;
            let conclusion = null;
            while (attempts < maxAttempts) {
              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
              const { data: updated } = await github.rest.checks.get({
                owner: clientOwner,
                repo:  clientRepo,
                check_run_id: checkRunId
              });
              console.log(`[${++attempts}] status: ${updated.status}, conclusion: ${updated.conclusion}`);
              if (updated.status === 'completed') {
                conclusion = updated.conclusion;
                break;
              }
            }
            if (conclusion !== 'success') {
              core.setFailed(`Component tests did not pass (conclusion: ${conclusion})`);
            }

      - name: Generate SBOM
        shell: bash
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -Dcyclonedx.outputFormat=json -Dcyclonedx.outputName=bom -Dcyclonedx.skipNotDeployed=false

      - name: Deploy to Maven Central
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
          GNUPGHOME: ${{ runner.temp }}/.gnupg
        run: |
          if [[ -n "${{ secrets.gpg_private_key }}" ]]; then
            mkdir -p $GNUPGHOME
            echo "${{ secrets.gpg_private_key }}" | gpg --batch --import
          fi
          PROFILE=""
          if [[ "${{ inputs.is_release }}" == "true" ]]; then
            PROFILE="-P release"
          fi
          jfrog mvn -B -e $PROFILE -DskipTests -Dmaven.test.skip=true deploy

      - name: Publish Build Info
        shell: bash
        env:
          JFROG_CLI_BUILD_NAME: ${{ github.event.repository.name }}
          JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          jfrog rt build-publish

      - name: Promote Release Build
        if: inputs.is_release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          JFROG_CLI_BUILD_NAME: ${{ github.event.repository.name }}
          JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Delaying promote to ensure all artifacts are available in Artifactory before promotion."
          sleep 15
          jfrog rt build-promote $JFROG_CLI_BUILD_NAME $JFROG_CLI_BUILD_NUMBER

      - name: Promote Snapshot Build
        if: inputs.is_release != true && !startsWith(github.ref, 'refs/heads/dependabot')
        shell: bash
        env:
          JFROG_CLI_BUILD_NAME: ${{ github.event.repository.name }}
          JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          jfrog rt build-promote $JFROG_CLI_BUILD_NAME $JFROG_CLI_BUILD_NUMBER

      - name: Release - Set next snapshot version
        if: inputs.is_release == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
          next_patch=$((patch + 1))
          next_snapshot_version="$major.$minor.$next_patch-SNAPSHOT"
          echo "Next snapshot version will be $next_snapshot_version"
          jfrog mvn versions:set -DnewVersion=$next_snapshot_version -DgenerateBackupPoms=false
          git commit -am "Bump to next snapshot version"

      - name: Generate Release Notes
        if: inputs.is_release == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ks-no/github-actions-public/generate-release-notes@main
        id: generate_body
        with:
          github-token: ${{ steps.app_token.outputs.app_token }}
          actor: ${{ github.actor }}
          reviewer: ${{ inputs.reviewer }}

      - name: Create GitHub Release
        if: inputs.is_release == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe #v2.6.1
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.app_token }}
        with:
          tag_name: ${{ inputs.version }}
          name: "Release ${{ inputs.version }}"
          body: ${{ steps.generate_body.outputs.release_body }}
          draft: false
          prerelease: false

      - name: Push changes
        if: inputs.is_release == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          git push --follow-tags


