name: Generate SBOM
description: Generate Software Bill of Materials using CycloneDX

inputs:
  version:
    description: 'Version to include in SBOM'
    required: true
  output-path:
    description: 'Output directory for SBOM'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Generate SBOM
      shell: bash
      run: |
        dotnet new tool-manifest --force
        dotnet tool install CycloneDX
        SLNFILE=$(find . -name "*.sln" | head -1)
        if [ -n "$SLNFILE" ]; then
          dotnet tool run dotnet-CycloneDX \
            "$SLNFILE" \
            --output ${{ inputs.output-path }} \
            --set-version ${{ inputs.version }} \
            --json
        else
          echo "No solution file found, skipping SBOM generation"
        fi
