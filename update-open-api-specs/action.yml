name: 'OpenAPI Spec CI'
description: >
  Lints, bundles, and deploys updated OpenAPI specifications.
  Each spec file given is only processed if it differs from the corresponding file
  residing in the `ks-no/ks-no.github.io` repo.

inputs:
  specs:
    description: >
      Comma-separated list of "service:specFile" pairs, e.g. "fullmakt-service:fullmakt-api-v1".
      Each spec's path is resolved as "${service}/target/api-spec/${specFile}.json".
    required: true
  ks_github_app_token:
    description: 'GitHub App token for logging in to other repos'
    required: true
  
runs:
  using: "composite"
  steps:

    - name: Checkout ks-no.github.io repository
      uses: ks-no/github-actions-public/checkout@main
      with:
        repository: ks-no/ks-no.github.io
        token: ${{ inputs.ks_github_app_token }}
        path: ks-no.github.io
        ref: source
        fetch-depth: '1'

    - name: Filter specs by change
      shell: bash
      run: |
        FILES=
        for pair in $(tr ',' ' ' <<< "${{ inputs.specs }}") ; do
          service="${pair%%:*}"
          specFile="${pair#*:}"
          file="${service}/target/api-spec/${specFile}.json"
          remote_file="ks-no.github.io/static/api/${file##*/}"
          # Add file to FILES if it is not equal to the corresponding file at ks-no.github.io
          if ! diff -qN "$remote_file" "$file" ; then
            FILES+="$file "
          fi
        done
        echo "FILES=$FILES" >> "$GITHUB_ENV"

    - name: Lint specs
      continue-on-error: true
      if: env.FILES != ''
      shell: bash
      run: redocly lint $FILES

    - name: Create build directories
      if: env.FILES != ''
      shell: bash
      run: mkdir -p builded-specs build

    - name: Bundle specs
      if: env.FILES != ''
      shell: bash
      run: |
        for file in $FILES ; do
          filename=$(basename "$file")
          redocly bundle "$file" --ext json -o "builded-specs/$filename"
        done

    - name: Get bundled spec files
      if: env.FILES != ''
      id: bundled_files
      shell: bash
      run: echo "files=$(ls builded-specs/*.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

    - name: Build HTML reports
      if: env.FILES != ''
      shell: bash
      run: |
        for file in ${{ steps.bundled_files.outputs.files }}; do
          filename=$(basename "$file" .json)
          redocly build-docs "$file" -o "build/$filename.html"
        done

    - name: Upload HTML reports as artifact
      if: env.FILES != ''
      uses: ks-no/github-actions-public/upload-artifact@main
      with:
        name: html-reports
        path: build/

    - name: Copy specs to ks-no.github.io
      if: env.FILES != ''
      shell: bash
      run: |
        mkdir -p ks-no.github.io/static/api
        for file in ${{ steps.bundled_files.outputs.files }}; do
          cp "$file" "ks-no.github.io/static/api/"
        done

    # Flere repoer pusher til ks-no.github.io/source, så pushen kan bli avvist fordi et
    # annet bygg kom først. Rebase på nytt og prøv igjen. Hvert repo skriver sine egne
    # spec-filer, så en konflikt betyr at to bygg publiserer samme fil - da feiler vi.
    - name: Commit and push changes
      if: env.FILES != ''
      shell: bash
      env:
        SOURCE_REPO: ${{ github.repository }}
      run: |
        cd ks-no.github.io
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add static/api/*.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Update OpenAPI specs from $SOURCE_REPO"
        for attempt in 1 2 3 4 5; do
          if ! git pull --rebase origin source; then
            git rebase --abort || true
            echo "::error::Konflikt mot ks-no.github.io/source. Et annet bygg har endret de samme spec-filene."
            exit 1
          fi
          if git push origin HEAD:source; then
            exit 0
          fi
          echo "Push avvist (forsøk $attempt av 5), prøver igjen ..."
          sleep $((attempt * 2 + RANDOM % 5))
        done
        echo "::error::Klarte ikke å pushe til ks-no.github.io etter 5 forsøk."
        exit 1

    - name: Trigger TypeScript model generation
      if: env.FILES != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
      with:
        github-token: ${{ inputs.ks_github_app_token }}
        script: |
          const owner = 'ks-no';
          const repo = 'fiks-typescript-api-models';
          const files = '${{ steps.bundled_files.outputs.files }}'.trim().split(/\s+/);

          for (const file of files) {
            const specName = file.split('/').pop().replace('.json', '');
            console.log(`Triggering TypeScript model generation for ${specName}`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'build-and-publish.yml',
              ref: 'master',
              inputs: { projectName: specName }
            });
          }