name: 'OpenAPI Spec CI'
description: >
  Lints, bundles, and deploys generated, updated OpenAPI specifications.
  This only works for specs that already exist at the
  ks-no/ks-no.github.io repo.

inputs:
  ks_github_app_token:
    description: 'GitHub App token for logging in to other repos'
    required: true
  
runs:
  using: "composite"
  steps:

    - name: Debug print
      shell: bash
      run: ls */target

    - name: Find and filter spec files
      id: spec_files
      shell: bash
      run: |
        FILES=
        shopt -s globstar
        for file in $(ls **/*.json) ; do
          echo "file: $file"
          remote_file="ks-no.github.io/static/api/${file##*/}"
          echo "remote file: $remote_file"
          # Add file to FILES if it is not equal to the corresponding file at ks-no.github.io
          if test -f "$remote_file" && ! diff -q "$remote_file" "$file" ; then
            FILES+="$file "
          fi
        done
        echo "files: $FILES"
        echo "files=$FILES" >> "$GITHUB_OUTPUT"

    - name: Checkout ks-no.github.io repository
      uses: ks-no/github-actions-public/checkout@main
      with:
        repository: ks-no/ks-no.github.io
        token: ${{ inputs.ks_github_app_token }}
        path: ks-no.github.io
        ref: source

    - name: Lint specs
      shell: bash
      run: |
        for file in ${{ steps.spec_files.outputs.files }}; do
          redocly lint "$file"
        done

    - name: Create build directories
      shell: bash
      run: mkdir -p builded-specs build

    - name: Bundle specs
      shell: bash
      run: |
        for file in ${{ steps.spec_files.outputs.files }}; do
          filename=$(basename "$file")
          redocly bundle "$file" --ext json -o "builded-specs/$filename"
        done

    - name: Get bundled spec files
      id: bundled_files
      shell: bash
      run: echo "files=$(ls builded-specs/*.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

    - name: Build HTML reports
      shell: bash
      run: |
        for file in ${{ steps.bundled_files.outputs.files }}; do
          filename=$(basename "$file" .json)
          redocly build-docs "$file" -o "build/$filename.html" --disableGoogleFont true
        done

