name: 'Download Actions artifacts'
description: 'Wrapper for actions/download-artifact, pinned to SHA'

inputs:
  path:
    description: 'Where to store the downloaded artifact'
    required: false
  name:
    description: 'Name of the artifact'
    required: false



runs:
  using: composite
  steps:
    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ inputs.path }}
        name: ${{ inputs.name }}