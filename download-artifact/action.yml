name: 'Download Actions artifacts'
description: 'Wrapper for actions/download-artifact, pinned to SHA'

inputs:
  path:
    description: 'Where to store the downloaded artifact'
    required: false
  name:
    description: 'Name of the artifact'
    required: false



runs:
  using: composite
  steps:
    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ inputs.path }}
        name: ${{ inputs.name }}