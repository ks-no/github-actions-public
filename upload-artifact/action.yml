name: 'Store Actions artifacts'
description: 'Wrapper for actions/upload-artifact, pinned to SHA'

inputs:
  path:
    description: 'Path to the file(s) to store'
    required: true
  name:
    description: 'Under what name should the artifact be stored'
    required: false
  if-no-files-found:
    description: 'What to return if there are no files (possible values: "warn", "error" and "ignore").'
    required: false
    default: 'warn'
  include-hidden-files:
    description: "Whether to include hidden files in artifact"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ inputs.path }}
        name: ${{ inputs.name }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        include-hidden-files: ${{ inputs.include-hidden-files }}