name: 'Setup JFrog CLI'
description: >
  Installs JFrog CLI and configures it with Artifactory credentials.
  Reusable by any pipeline (Java, .NET, etc.) — no build-tool-specific config.

inputs:
  artifactory_username:
    description: 'The username for Artifactory'
    required: true
  artifactory_password:
    description: 'The password for Artifactory'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@ae385c7164244e984cd20a58674e5b57f53596d7 #v5.3.4
      with:
        version: latest

    - name: Configure JFrog CLI with Artifactory
      shell: bash
      env:
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory_username }}
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory_password }}
      run: |
        jfrog config add artifactory --url="https://artifactory.fiks.ks.no" --user="$ARTIFACTORY_USERNAME" --password="$ARTIFACTORY_PASSWORD" --interactive=false --overwrite

    - name: Ensure valid JFrog build name
      shell: bash
      run: |
         if [[ -z "$JFROG_CLI_BUILD_NAME" || "$JFROG_CLI_BUILD_NAME" == .* ]]; then
         echo "JFROG_CLI_BUILD_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
         fi