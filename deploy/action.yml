name: 'Deploy to 013'
description: 'Sends a deployment message to AWS SQS after authenticating with OIDC. Optionally fetches SBOM from Artifactory and uploads to Dependency-Track.'
inputs:
  helm_chart:
    description: 'Helm-chart to deploy'
    required: true
  environment:
    description: 'Deployment environment'
    required: true
  version:
    description: 'Version to deploy'
    required: true
  ks_github_app_id:
    description: 'KS GitHub App ID'
    required: true
  ks_github_app_private_key:
    description: 'KS GitHub App Private Key'
    required: true
  artifactory_username:
    description: 'Artifactory username for fetching SBOM. If empty, SBOM steps are skipped.'
    required: false
    default: ''
  artifactory_password:
    description: 'Artifactory password for fetching SBOM.'
    required: false
    default: ''
  dependency_track_api_key:
    description: 'Dependency-Track API key. If empty, DT upload is skipped.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Write deploy summary
      shell: bash
      run: |
        {
          echo "### Deploy"
          echo ""
          echo "| Environment | Version |"
          echo "|---|---|"
          echo "| \`${{ inputs.environment }}\` | \`${{ inputs.version }}\` |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Set up Github App'
      id: app_token
      uses: ks-no/github-actions-public/setup-github-app@main
      with:
        ks_github_app_id: ${{ inputs.ks_github_app_id }}
        ks_github_app_private_key: ${{ inputs.ks_github_app_private_key }}

    - name: Setup JFrog CLI
      if: inputs.artifactory_username != '' && inputs.environment == 'prod'
      uses: ks-no/github-actions-public/setup-jfrog-cli@main
      with:
        artifactory_username: ${{ inputs.artifactory_username }}
        artifactory_password: ${{ inputs.artifactory_password }}

    - name: SBOM Upload and Report
      if: inputs.dependency_track_api_key != '' && inputs.artifactory_username != '' && inputs.environment == 'prod'
      uses: ks-no/github-actions-public/sbom-upload-and-report@main
      continue-on-error: true
      with:
        dependency_track_api_key: ${{ inputs.dependency_track_api_key }}
        project_version: 'prod'
        artifactory_repository_name: ${{ github.event.repository.name }}
        artifactory_fetch_version: ${{ inputs.version }}

    - name: Configure AWS credentials from GitHub OIDC
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
      with:
        role-to-assume: 'arn:aws:iam::461074034890:role/github-to-aws'
        aws-region: 'eu-north-1'
        role-skip-session-tagging: true

    - name: Get User Full Name
      id: user_info
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.app_token }}
      shell: bash
      run: |
        USER_FULL_NAME=$(gh api "/users/${{ github.actor }}" --jq '.name // ""')
        if [ -z "$USER_FULL_NAME" ]; then
          USER_FULL_NAME="${{ github.actor }}"
        fi
        echo "user_full_name=$USER_FULL_NAME" >> $GITHUB_OUTPUT

    - name: Send deployment message to SQS
      shell: bash
      run: |
        aws sts get-caller-identity
        aws sqs send-message --queue-url 'https://sqs.eu-north-1.amazonaws.com/461074034890/deployment-queue' --message-body "{\"version\": \"${{ inputs.version }}\", \"helm_chart\": \"${{ inputs.helm_chart }}\", \"environment\": \"${{ inputs.environment }}\", \"repo\": \"${{ github.repository }}\", \"user\": \"${{ steps.user_info.outputs.user_full_name }}\"}"