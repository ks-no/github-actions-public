name: 'Create Next Snapshot Version'
description: 'Creates the next snapshot version after a release.'
inputs:
  artifactory_username:
    description: 'The username for Artifactory'
    required: true
  artifactory_password:
    description: 'The password for Artifactory'
    required: true
  version:
    description: 'The release version that was just created (e.g., 1.2.3)'
    required: true
  ks_github_app_token:
    description: 'Token for checking out code and pushing changes'
    required: true
  release_body:
    description: 'The body of release text for actual release'
    required: true
  working_directory:
    description: 'Directory that contains the root pom.xml, relative to the repo root (e.g. "backend").'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:

    - name: Set next snapshot version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
        next_patch=$((patch + 1))
        next_snapshot_version="$major.$minor.$next_patch-SNAPSHOT"
        echo "Next snapshot version will be $next_snapshot_version"
        jfrog mvn versions:set -DnewVersion=$next_snapshot_version -DgenerateBackupPoms=false

    - name: Commit next snapshot version
      shell: bash
      run: |
        git commit -am "Bump to next snapshot version"
        # --atomic er påkrevd: uten den behandler receive-pack hver ref for seg, og en
        # push som avvises fordi main har flyttet seg (f.eks. en dependabot-merge midt i
        # releasen) slipper likevel taggen igjennom. Da blir taggen stående på en commit
        # som ikke er nåbar fra noen branch.
        git push --atomic --follow-tags origin HEAD

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 #v3.0.4
      env:
        GITHUB_TOKEN: ${{ inputs.ks_github_app_token }}
      with:
        tag_name: ${{ inputs.version }}
        name: "Release ${{ inputs.version }}"
        body: ${{ inputs.release_body }}
        draft: false
        prerelease: false