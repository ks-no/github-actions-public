name: 'Publish Docker Image without Jib'
description: 'Build Docker image, push to Artifactory using JFrog CLI, generate and upload SBOM using Syft'

inputs:
  is_release:
    description: 'true for release, false for snapshot'
    required: true
  image_name:
    description: 'Name of the Docker image'
    required: true
  dockerfile:
    description: 'Dockerfile to use'
    required: true
    default: 'Dockerfile'
  build_name:
    description: 'JFrog build name'
    required: true
  tags:
    description: 'Comma-separated list of tags for the Docker image'
    required: true
  artifactory_username:
    description: 'Artifactory username'
    required: true
  artifactory_password:
    description: 'Artifactory password'
    required: true
  dt_api_key:
    description: 'Key for interacting with Dependency-Track API'
    required: false
  npmrc:
    description: 'Full .npmrc content (one or more registry auth lines) exposed to the build as a secret'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup JFrog CLI
      uses: ks-no/github-actions-public/setup-jfrog-cli@main
      with:
        artifactory_username: ${{ inputs.artifactory_username }}
        artifactory_password: ${{ inputs.artifactory_password }}

    - name: Set Docker repository
      id: set_repo
      shell: bash
      run: |
        if [[ "${{ inputs.is_release }}" == "true" ]]; then
          echo "repo=docker-local.artifactory.fiks.ks.no" >> $GITHUB_OUTPUT
        else
          echo "repo=docker-local-snapshots.artifactory.fiks.ks.no" >> $GITHUB_OUTPUT
        fi

    - name: Log in to Artifactory (for base image pull)
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
      with:
        registry: docker-all.artifactory.fiks.ks.no
        username: ${{ inputs.artifactory_username }}
        password: ${{ inputs.artifactory_password }}

    - name: Build Docker image
      id: build_image
      shell: bash
      run: |
        docker build \
          -t ${{ inputs.image_name }} \
          -f ${{ inputs.dockerfile }} \
          --secret id=npmrc,env=NPMRC \
          --no-cache \
          .
      env:
        NPMRC: ${{ inputs.npmrc }}

    - name: Tag and Push Docker image
      shell: bash
      run: |
        REPO_URL="${{ steps.set_repo.outputs.repo }}"
        IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
        for tag in "${TAGS[@]}"; do
          # Trim whitespace from tag
          tag=$(echo "$tag" | xargs)
          if [ -n "$tag" ]; then
            echo "Tagging and pushing ${{ inputs.image_name }} as $REPO_URL/${{ inputs.image_name }}:$tag"
            docker tag "${{ inputs.image_name }}" "$REPO_URL/${{ inputs.image_name }}:$tag"
            jfrog docker push "$REPO_URL/${{ inputs.image_name }}:$tag"
          fi
        done

    - name: Generate SBOM
      id: sbom
      uses: ks-no/github-actions-public/syft-sbom@main
      with:
        image_name: ${{ inputs.image_name }}

    - name: Upload SBOM to Dependency-Track
      uses: ks-no/github-actions-public/sbom-upload-and-report@main
      with:
        dependency_track_api_key: ${{ inputs.dt_api_key }}
        project_name: ${{ inputs.image_name }}
        is_release: ${{ inputs.is_release }}
        bom_file: ${{ steps.sbom.outputs.bom_file }}

    - name: Publish build info
      shell: bash
      run: |
        jfrog rt build-publish "$JFROG_CLI_BUILD_NAME" "$GITHUB_RUN_NUMBER"