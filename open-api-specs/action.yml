name: 'OpenAPI Spec CI'
description: 'Lints, bundles, and deploys OpenAPI specifications.'
inputs:
  ks_github_app_id:
    description: 'ID for the GitHub App.'
    required: true
  ks_github_app_private_key:
    description: 'Private key for accessing the GitHub App.'
    required: true
  specs_folder:
    description: 'Folder for OpenAPI specs (default: "specs").'
    required: false
  
runs:
  using: "composite"
  steps:
    - name: Check out code
      uses: ks-no/github-actions-public/checkout@main
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true

    - name: Set up github app for pushing changes
      id: setup_github_app
      uses: ks-no/github-actions-public/setup-github-app@main
      with:
        ks_github_app_id: ${{ inputs.ks_github_app_id }}
        ks_github_app_private_key: ${{ inputs.ks_github_app_private_key }}

    - name: Get spec files
      id: spec_files
      shell: bash
      run: echo "files=$(ls ${{ inputs.specs_folder || 'specs' }}/*.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

    - name: Lint specs
      shell: bash
      run: |
        for file in ${{ steps.spec_files.outputs.files }}; do
          redocly lint "$file"
        done

    - name: Create build directories
      shell: bash
      run: mkdir -p builded-specs build

    - name: Bundle specs
      shell: bash
      run: |
        for file in ${{ steps.spec_files.outputs.files }}; do
          filename=$(basename "$file")
          redocly bundle "$file" --ext json -o "builded-specs/$filename"
        done

    - name: Get bundled spec files
      id: bundled_files
      shell: bash
      run: echo "files=$(ls builded-specs/*.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

    - name: Build HTML reports
      shell: bash
      run: |
        for file in ${{ steps.bundled_files.outputs.files }}; do
          filename=$(basename "$file" .json)
          redocly build-docs "$file" -o "build/$filename.html" --disableGoogleFont true
        done

    - name: Upload HTML reports as artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
      with:
        name: html-reports
        path: build/

    - name: Checkout ks-no.github.io repository
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
      with:
        repository: ks-no/ks-no.github.io
        token: ${{ steps.setup_github_app.outputs.app_token }}
        path: ks-no.github.io
        ref: source

    - name: Copy specs to ks-no.github.io
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      shell: bash
      run: |
        mkdir -p ks-no.github.io/static/api
        for file in ${{ steps.bundled_files.outputs.files }}; do
          cp "$file" "ks-no.github.io/static/api/"
        done

    - name: Commit and push changes
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      shell: bash
      run: |
        cd ks-no.github.io
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add static/api/*.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update OpenAPI specs"
          git push origin HEAD:source
        fi

    - name: Trigger TypeScript model generation
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      shell: bash
      run: |
        for file in ${{ steps.bundled_files.outputs.files }}; do
          specName=$(basename "$file" .json)
          echo "Triggering TypeScript model generation for $specName"
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ steps.setup_github_app.outputs.app_token }}" \
            https://api.github.com/repos/ks-no/fiks-typescript-api-models/dispatches \
            -d '{"event_type": "generate-models", "client_payload": { "projectName": "'"$specName"'" }}'
        done