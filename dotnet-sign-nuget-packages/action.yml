name: Sign NuGet Packages
description: Downloads, signs with DigiCert KeyLocker through the NuGet client, and re-uploads NuGet packages.

inputs:
  artifact-name:
    description: 'Name of the artifact containing the .nupkg files'
    required: false
    default: 'nupkg'
  package-path:
    description: 'Local path to download packages into'
    required: false
    default: 'packages'
  signed-artifact-name:
    description: 'Name of the artifact to upload after signing'
    required: false
    default: 'signed-nupkg'
  sm-host:
    description: 'DigiCert Software Trust Manager host URL (SM_HOST)'
    required: true
  sm-keypair-alias:
    description: 'DigiCert keypair alias (SM_KEY_PAIR_ALIAS)'
    required: true
  sm-api-key:
    description: 'DigiCert SM API key (secret)'
    required: true
  sm-client-cert-file-base64:
    description: 'Base64-encoded PKCS12 client certificate (secret)'
    required: true
  sm-client-cert-password:
    description: 'Password for the PKCS12 client certificate (secret)'
    required: true
  certificate-fingerprint:
    description: 'SHA-256 thumbprint of the code signing certificate in KeyLocker. Not a secret.'
    required: true
  timestamp-url:
    description: 'RFC 3161 timestamp server'
    required: false
    default: 'http://timestamp.digicert.com'

runs:
  using: composite
  steps:
    - name: Download nupkg
      uses: ks-no/github-actions-public/download-artifact@main
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.package-path }}

    - name: Setup SM_CLIENT_CERT_FILE from base64 secret data
      shell: pwsh
      env:
        SM_CLIENT_CERT_FILE_BASE64: ${{ inputs.sm-client-cert-file-base64 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $dest = Join-Path $env:RUNNER_TEMP 'Certificate_pkcs12.p12'
        [System.IO.File]::WriteAllBytes($dest, [System.Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_BASE64))

    - name: Install DigiCert KeyLocker tools and KSP
      uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
      with:
        simple-signing-mode: false
      env:
        SM_HOST: ${{ inputs.sm-host }}
        SM_API_KEY: ${{ inputs.sm-api-key }}
        SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
        SM_CLIENT_CERT_PASSWORD: ${{ inputs.sm-client-cert-password }}

    - name: Sync KeyLocker certificate into the Windows store
      shell: pwsh
      env:
        SM_HOST: ${{ inputs.sm-host }}
        SM_API_KEY: ${{ inputs.sm-api-key }}
        SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
        SM_CLIENT_CERT_PASSWORD: ${{ inputs.sm-client-cert-password }}
        SM_KEYPAIR_ALIAS: ${{ inputs.sm-keypair-alias }}
      run: |
        $ErrorActionPreference = 'Stop'
        smctl windows certsync --keypair-alias="$env:SM_KEYPAIR_ALIAS"
        if ($LASTEXITCODE -ne 0) { throw "smctl windows certsync failed with exit code $LASTEXITCODE" }

    - name: Sign packages with the NuGet client
      shell: pwsh
      env:
        SM_HOST: ${{ inputs.sm-host }}
        SM_API_KEY: ${{ inputs.sm-api-key }}
        SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
        SM_CLIENT_CERT_PASSWORD: ${{ inputs.sm-client-cert-password }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        CERT_FINGERPRINT: ${{ inputs.certificate-fingerprint }}
        TIMESTAMP_URL: ${{ inputs.timestamp-url }}
      run: |
        $ErrorActionPreference = 'Stop'
        nuget sign (Join-Path $env:PACKAGE_PATH '*.nupkg') `
          -Timestamper $env:TIMESTAMP_URL `
          -CertificateFingerprint $env:CERT_FINGERPRINT `
          -HashAlgorithm SHA256 `
          -Verbosity detailed
        if ($LASTEXITCODE -ne 0) { throw "nuget sign failed with exit code $LASTEXITCODE" }

    - name: Upload signed packages
      uses: ks-no/github-actions-public/upload-artifact@main
      with:
        name: ${{ inputs.signed-artifact-name }}
        if-no-files-found: error
        path: |
          ${{ inputs.package-path }}/*.nupkg
          ${{ inputs.package-path }}/*.snupkg
