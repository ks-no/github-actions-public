    - name: Publish Maven Artifacts
      shell: bash
      run: |
        jfrog mvn -B deploy -DskipTests --build-name=$BUILD_NAME --build-number=$GITHUB_RUN_NUMBER

    - name: Publish Build Info
      shell: bash
      run: |
        jfrog rt build-publish $BUILD_NAME $GITHUB_RUN_NUMBER

    - name: Promote Release Build
      if: ${{ inputs.is_release == 'true' }}
      shell: bash
      run: |
        jfrog rt build-promote $BUILD_NAME $GITHUB_RUN_NUMBER ks-maven

    - name: Debug print
      shell: bash
      run: ls */target
