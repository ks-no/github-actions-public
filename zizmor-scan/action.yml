name: 'Zizmor Security Audit'
description: 'Run Zizmor GitHub Actions security linter with GitHub annotations output'

inputs:
  output_format:
    description: 'The output format for Zizmor'
    required: false
    default: 'github'

runs:
  using: 'composite'
  steps:
    - name: Run Zizmor scan
      uses: zizmorecore/zizmor-action@a16621b09c6db4281f81a93cb393b05dcd7b7165 # 0.5.5
      with:
        config: ${{ github.action_path }}/zizmor.yml
        advanced-security: false

    - name: Upload SARIF results
      if: ${{ inputs.output_format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        sarif_file: zizmor-results.sarif
        category: zizmor