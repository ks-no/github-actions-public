name: 'Zizmor Security Audit'
description: 'Run Zizmor GitHub Actions security linter with GitHub annotations output'

inputs:
  output_format:
    description: 'The output format for Zizmor'
    required: false
    default: 'github'

runs:
  using: 'composite'
  steps:
    - name: Prepare Zizmor config in repo root
      shell: bash
      run: cp "${{ github.action_path }}/zizmor.yml" ".zizmor.yml"

    - name: Run Zizmor scan
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        config: .zizmor.yml
        advanced-security: ${{ inputs.output_format == 'sarif' }}
        annotations: ${{ inputs.output_format == 'github' }}