name: 'Zizmor Security Audit'
description: 'Run Zizmor GitHub Actions security linter with GitHub annotations output'

inputs:
  output_format:
    description: 'The output format for Zizmor'
    required: false
    default: 'github'

runs:
  using: 'composite'
  steps:
    - name: Prepare Zizmor config in workspace
      shell: bash
      run: cp "${{ github.action_path }}/zizmor.yml" "${{ github.workspace }}/.zizmor.yml"

    - name: Run Zizmor scan
      uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
      with:
        config: ${{ github.workspace }}/.zizmor.yml
        advanced-security: ${{ inputs.output_format == 'sarif' }}
        annotations: ${{ inputs.output_format == 'github' }}