name: 'SBOM Upload and Report'
description: >
  Uploads a CycloneDX SBOM to Dependency-Track, stores in Artifactory for retention,
  tags the project with the owning team from CODEOWNERS, and posts a vulnerability summary
  to the GitHub Actions Job Summary. Fails softly — never blocks the pipeline.

inputs:
  dependency_track_api_key:
    description: 'API key for Dependency-Track (must have PORTFOLIO_MANAGEMENT + TAG_MANAGEMENT permissions). If empty, DT upload is skipped.'
    required: false
    default: ''
  is_release:
    description: 'Whether this is a release build. Used to derive project version when project_version is not explicitly set.'
    required: false
    default: 'false'
  project_name:
    description: 'Dependency-Track project name (typically github.event.repository.name).'
    required: false
    default: ${{ github.event.repository.name }}
  project_version:
    description: 'Optional explicit Dependency-Track project version override (e.g. main or prod).'
    required: false
    default: ''
  bom_file:
    description: >
      Path to the CycloneDX BOM file. Leave empty to auto-discover
      (searches target/bom.xml, target/bom.json, bom.xml, bom.json).
    required: false
    default: ''
  artifactory_repository_name:
    description: 'Repository name for Artifactory path (default: github.event.repository.name).'
    required: false
    default: ${{ github.event.repository.name }}
  artifactory_artifact_version:
    description: 'Version string for Artifactory BOM path (e.g., 1.2.3). Required for is_release=true.'
    required: false
    default: ''
  artifactory_fetch_version:
    description: 'Version to fetch BOM from Artifactory (used at deploy time when no local BOM exists). If empty, no remote fetch is attempted.'
    required: false
    default: ''
  defer_dependency_track:
    description: 'Skip DT upload (deferred to deploy phase). BOM is still stored in Artifactory.'
    required: false
    default: 'false'

outputs:
  artifactory_bom_url:
    description: 'URL to the BOM in Artifactory (if uploaded).'
    value: ${{ steps.artifactory_upload.outputs.bom_url }}
  artifactory_bom_sha256:
    description: 'SHA256 hash of the BOM file (if uploaded).'
    value: ${{ steps.artifactory_upload.outputs.bom_sha256 }}

runs:
  using: "composite"
  steps:
    - name: Auto-discover BOM file
      id: bom_discovery
      shell: bash
      env:
        BOM_FILE_INPUT: ${{ inputs.bom_file }}
        ARTIFACTORY_FETCH_VERSION: ${{ inputs.artifactory_fetch_version }}
        ARTIFACTORY_REPO_NAME: ${{ inputs.artifactory_repository_name }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        BOM_FILE=""

        # Explicit bom_file input takes precedence
        if [[ -n "$BOM_FILE_INPUT" && -f "$BOM_FILE_INPUT" ]]; then
          BOM_FILE="$BOM_FILE_INPUT"
        elif [[ -n "$ARTIFACTORY_FETCH_VERSION" ]]; then
          # Fetch from Artifactory (deploy-time path)
          if command -v jfrog &> /dev/null; then
            for REPO_PREFIX in "sbom-prod" "sbom-main"; do
              for FORMAT in "json" "xml"; do
                REMOTE_PATH="${REPO_PREFIX}/${ARTIFACTORY_REPO_NAME}/${ARTIFACTORY_FETCH_VERSION}/bom.${FORMAT}"
                LOCAL_PATH="${RUNNER_TEMP}/bom.${FORMAT}"
                echo "Attempting to fetch from ${REMOTE_PATH}..."
                if jfrog rt download "${REMOTE_PATH}" "${LOCAL_PATH}" --flat --fail-no-op; then
                  BOM_FILE="${LOCAL_PATH}"
                  echo "✓ Found SBOM: ${REMOTE_PATH}"
                  break 2
                fi
              done
            done
          else
            echo "::warning::JFrog CLI not found — cannot fetch SBOM from Artifactory"
          fi
        else
          # Local discovery
          for candidate in target/bom.xml target/bom.json bom.xml bom.json; do
            if [[ -f "$candidate" ]]; then
              BOM_FILE="$candidate"
              break
            fi
          done
        fi
        
        if [[ -z "$BOM_FILE" || ! -f "$BOM_FILE" ]]; then
          echo "bom_found=false" >> $GITHUB_OUTPUT
        else
          echo "bom_found=true" >> $GITHUB_OUTPUT
          echo "bom_file=$BOM_FILE" >> $GITHUB_OUTPUT
        fi

    - name: Store SBOM in Artifactory
      id: artifactory_upload
      if: inputs.artifactory_artifact_version != '' && steps.bom_discovery.outputs.bom_found == 'true'
      shell: bash
      env:
        ARTIFACTORY_REPO_NAME: ${{ inputs.artifactory_repository_name }}
        ARTIFACTORY_ARTIFACT_VERSION: ${{ inputs.artifactory_artifact_version }}
        IS_RELEASE: ${{ inputs.is_release }}
        BOM_FILE: ${{ steps.bom_discovery.outputs.bom_file }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail

        # Require JFrog CLI on PATH (provided by setup-jfrog-cli or prepare-the-frog)
        if ! command -v jfrog &> /dev/null; then
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "::warning::JFrog CLI not found — release build not archived to Artifactory. Add setup-jfrog-cli step before sbom-upload-and-report."
          fi
          exit 0
        fi

        # Validate BOM format (JSON or XML)
        if [[ "$BOM_FILE" == *.json ]]; then
          if ! jq empty "$BOM_FILE" 2>/dev/null; then
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo "::warning::BOM JSON file is not valid — release build not archived to Artifactory"
            fi
            exit 0
          fi
        elif [[ "$BOM_FILE" == *.xml ]]; then
          if ! head -1 "$BOM_FILE" | grep -q '<'; then
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo "::warning::BOM XML file appears invalid — release build not archived to Artifactory"
            fi
            exit 0
          fi
        fi

        # Compute SHA256
        BOM_SHA256=$(sha256sum "$BOM_FILE" | awk '{print $1}')

        # Determine environment
        ENVIRONMENT="main"
        if [[ "$IS_RELEASE" == "true" ]]; then
          ENVIRONMENT="prod"
        fi

        # Determine file extension for Artifactory path
        BOM_EXT="${BOM_FILE##*.}"
        ARTIFACTORY_PATH="sbom-${ENVIRONMENT}/${ARTIFACTORY_REPO_NAME}/${ARTIFACTORY_ARTIFACT_VERSION}/bom.${BOM_EXT}"

        # Upload — capture exit code separately to avoid pipefail masking
        UPLOAD_LOG="$RUNNER_TEMP/artifactory_upload.log"
        UPLOAD_RC=0
        jfrog rt upload "$BOM_FILE" "$ARTIFACTORY_PATH" \
          > "$UPLOAD_LOG" 2>&1 || UPLOAD_RC=$?
        cat "$UPLOAD_LOG"

        if [[ "$UPLOAD_RC" -eq 0 ]]; then
          BOM_URL="https://artifactory.fiks.ks.no/artifactory/${ARTIFACTORY_PATH}"
          echo "bom_url=$BOM_URL" >> $GITHUB_OUTPUT
          echo "bom_sha256=$BOM_SHA256" >> $GITHUB_OUTPUT
          echo "SBOM archived to Artifactory: $BOM_URL"
        else
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "::warning::Failed to upload BOM to Artifactory (exit code $UPLOAD_RC) — release build not archived, but continuing pipeline"
          fi
        fi
        rm -f "$UPLOAD_LOG"

    - name: Upload SBOM to Dependency-Track
      id: sbom_upload
      if: inputs.dependency_track_api_key != '' && inputs.defer_dependency_track != 'true'
      shell: bash
      env:
        DT_API_KEY: ${{ inputs.dependency_track_api_key }}
        DT_IS_RELEASE: ${{ inputs.is_release }}
        DT_PROJECT_NAME: ${{ inputs.project_name }}
        DT_PROJECT_VERSION: ${{ inputs.project_version }}
        BOM_FILE: ${{ steps.bom_discovery.outputs.bom_file }}
        BOM_FOUND: ${{ steps.bom_discovery.outputs.bom_found }}
        DT_BASE_URL: "https://dt.fiks.dev.ks.no"
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail

        PROJECT_VERSION="$DT_PROJECT_VERSION"
        if [[ -z "$PROJECT_VERSION" ]]; then
          if [[ "$DT_IS_RELEASE" == "true" ]]; then
            PROJECT_VERSION="prod"
          else
            PROJECT_VERSION="main"
          fi
        fi
        echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

        # Skip BOM upload if not found, but still set project_version for downstream steps
        if [[ "$BOM_FOUND" != "true" ]]; then
          echo "::warning::No BOM file found — skipping SBOM upload to Dependency-Track"
          exit 0
        fi

        RESPONSE_FILE="$RUNNER_TEMP/dt-bom-response.json"

        HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
          -X POST -H "X-Api-Key: $DT_API_KEY" \
          -F "projectName=$DT_PROJECT_NAME" \
          -F "projectVersion=$PROJECT_VERSION" \
          -F "autoCreate=true" \
          -F "bom=@$BOM_FILE" \
          "$DT_BASE_URL/api/v1/bom") || true

        if ! [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
          echo "::warning::SBOM upload to Dependency-Track failed (no HTTP response)"
        elif [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
          TOKEN=$(jq -r '.token // empty' "$RESPONSE_FILE" 2>/dev/null || true)
          echo "bom_token=$TOKEN" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::SBOM upload to Dependency-Track returned HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE" 2>/dev/null || true
        fi
        rm -f "$RESPONSE_FILE"

    - name: Tag DT project with owning team
      if: inputs.dependency_track_api_key != '' && inputs.defer_dependency_track != 'true'
      uses: ks-no/github-actions-public/tag-dt-project-by-team@main
      with:
        dependency_track_api_key: ${{ inputs.dependency_track_api_key }}
        project_name: ${{ inputs.project_name }}
        project_version: ${{ steps.sbom_upload.outputs.project_version }}

    - name: DT vulnerability summary
      if: inputs.dependency_track_api_key != '' && inputs.defer_dependency_track != 'true'
      uses: ks-no/github-actions-public/dt-vulnerability-summary@main
      with:
        dependency_track_api_key: ${{ inputs.dependency_track_api_key }}
        project_name: ${{ inputs.project_name }}
        project_version: ${{ steps.sbom_upload.outputs.project_version }}
        bom_upload_token: ${{ steps.sbom_upload.outputs.bom_token }}
