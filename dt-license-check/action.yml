name: 'Dependency License Check'
description: >
  Fetches Dependency-Track components for one project and posts a grouped
  license inventory to the GitHub Job Summary. Fails softly.

inputs:
  dependency_track_api_key:
    description: 'API key for Dependency-Track (PORTFOLIO_MANAGEMENT permission).'
    required: true
  project_name:
    description: 'Dependency-Track project name (typically github.event.repository.name).'
    required: true
  project_version:
    description: 'Dependency-Track project version (environment marker, e.g. main or prod).'
    required: false
    default: 'main'
  project_uuid:
    description: 'Optional pre-resolved project UUID. If provided, skips the project lookup.'
    required: false
    default: ''
  dependency_track_base_url:
    description: 'Dependency-Track base URL (HTTPS only).'
    required: false
    default: 'https://dt.fiks.dev.ks.no'
  max_detail_rows:
    description: 'Maximum number of component rows to include in detailed summary output.'
    required: false
    default: '400'

outputs:
  project_uuid:
    description: 'Resolved project UUID used for this report.'
    value: ${{ steps.resolve_project.outputs.project_uuid }}
  # The report step writes these last. If it fails or is skipped they are empty,
  # and || '0' reports 0, as before.
  total_components:
    description: 'Total number of components scanned for this project.'
    value: ${{ steps.report.outputs.total_components || '0' }}
  unknown_license_count:
    description: 'Number of components with unknown license classification.'
    value: ${{ steps.report.outputs.unknown_license_count || '0' }}

runs:
  using: 'composite'
  steps:
    - name: Resolve DT project
      id: resolve_project
      uses: ks-no/github-actions-public/resolve-dt-project@main
      with:
        dependency_track_api_key: ${{ inputs.dependency_track_api_key }}
        project_name: ${{ inputs.project_name }}
        project_version: ${{ inputs.project_version }}
        project_uuid: ${{ inputs.project_uuid }}
        base_url: ${{ inputs.dependency_track_base_url }}
        warning_prefix: 'DT license check'

    - name: Fetch components from DT
      id: components
      if: steps.resolve_project.outputs.resolved == 'true'
      shell: bash
      env:
        DT_API_KEY: ${{ inputs.dependency_track_api_key }}
        DT_PROJECT_UUID: ${{ steps.resolve_project.outputs.project_uuid }}
        DT_BASE_URL: ${{ steps.resolve_project.outputs.base_url }}
      run: bash "$GITHUB_ACTION_PATH/fetch-components.sh"

    - name: Fetch license catalog from DT
      id: licenses
      if: steps.components.outputs.ok == 'true'
      shell: bash
      env:
        DT_API_KEY: ${{ inputs.dependency_track_api_key }}
        DT_BASE_URL: ${{ steps.resolve_project.outputs.base_url }}
        WORK_DIR: ${{ steps.components.outputs.work_dir }}
      run: bash "$GITHUB_ACTION_PATH/fetch-licenses.sh"

    - name: Build license report
      id: report
      if: steps.components.outputs.ok == 'true' && steps.licenses.outputs.ok == 'true'
      shell: bash
      env:
        DT_PROJECT_NAME: ${{ inputs.project_name }}
        DT_PROJECT_VERSION: ${{ inputs.project_version }}
        DT_PROJECT_UUID: ${{ steps.resolve_project.outputs.project_uuid }}
        DT_BASE_URL: ${{ steps.resolve_project.outputs.base_url }}
        WORK_DIR: ${{ steps.components.outputs.work_dir }}
        MAX_DETAIL_ROWS: ${{ inputs.max_detail_rows }}
      run: bash "$GITHUB_ACTION_PATH/build-report.sh"
