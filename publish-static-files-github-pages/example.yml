name: Publish Static Files to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, x64]
    steps:
      - name: Checkout repository
        uses: ks-no/github-actions-public/checkout@main

      - name: Publish static files to GitHub Pages
        uses: ks-no/github-actions-public/publish-static-files-github-pages@main
        with:
          files_folder: "source"
          target_folder: "target"
          ks_github_app_id: ${{ vars.KS_RUNNER_APP_ID }}
          ks_github_app_private_key: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}

