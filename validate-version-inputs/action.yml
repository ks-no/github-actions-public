name: 'Validate Version Inputs'
description: 'Fails if both version and semver_increment are provided, or if a release build has neither.'

inputs:
  version:
    description: 'The explicit release version (e.g., 1.2.3). Mutually exclusive with semver_increment.'
    required: false
    default: ''
  semver_increment:
    description: 'The semver increment strategy ("next major", "next minor", "next patch"). Mutually exclusive with version.'
    required: false
    default: ''
  is_release:
    description: 'Whether this is a release build. If true, either version or semver_increment must be set.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 'Validate version inputs'
      shell: bash
      run: |
        if [[ -n "$VERSION" && -n "$SEMVER_INCREMENT" ]] ; then
          echo "::error::Both 'version' and 'semver_increment' are set. Please provide only one."
          exit 1
        fi
        if [[ "$IS_RELEASE" == "true" && -z "$VERSION" && -z "$SEMVER_INCREMENT" ]] ; then
          echo "::error::Release build requires either 'version' or 'semver_increment' to be set."
          exit 1
        fi
        if [[ -n "$VERSION" && ! "$VERSION" =~ ^([0-9]|[1-9][0-9]+)\.([0-9]|[1-9][0-9]+)\.([0-9]|[1-9][0-9]+)$ ]] ; then
          echo "::error::'version' must be in the format X.Y.Z where X, Y, and Z are non-negative integers."
          exit 1
        fi
        if [[ -n "$SEMVER_INCREMENT" && ! "$SEMVER_INCREMENT" =~ ^next\ (major|minor|patch)$ ]] ; then
          echo "::error::'semver_increment' must be one of 'next major', 'next minor', or 'next patch'."
          exit 1
        
        fi
      env:
        VERSION: ${{ inputs.version }}
        SEMVER_INCREMENT: ${{ inputs.semver_increment }}
        IS_RELEASE: ${{ inputs.is_release }}
