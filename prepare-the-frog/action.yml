name: 'Prepare JFrog CLI'
description: 'Sets up JFrog CLI and configures it with Artifactory.'

inputs:
  artifactory_username:
    description: 'The username for Artifactory'
    required: true
  artifactory_password:
    description: 'The password for Artifactory'
    required: true
  use_maven_wrapper:
    description: 'Set to true to make jfrog mvn use the Maven wrapper (mvnw) in the repository instead of the Maven installed on the runner.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e #v5.1.0
      with:
        version: latest

    - name: Configure JFrog CLI with Artifactory
      shell: bash
      env:
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory_username }}
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory_password }}
      run: |
        jfrog config add artifactory --url="https://artifactory.fiks.ks.no" --user="$ARTIFACTORY_USERNAME" --password="$ARTIFACTORY_PASSWORD" --interactive=false --overwrite

    - name: Configure JFrog Maven
      shell: bash
      env:
        USE_MAVEN_WRAPPER: ${{ inputs.use_maven_wrapper }}
      run: |
        wrapper_args=()
        if [ "$USE_MAVEN_WRAPPER" = "true" ]; then
          wrapper_args+=(--use-wrapper)
        fi
        jfrog mvn-config --repo-deploy-releases maven-local-staging --repo-deploy-snapshots maven-local-staging --repo-resolve-releases maven-all --repo-resolve-snapshots maven-all "${wrapper_args[@]}"